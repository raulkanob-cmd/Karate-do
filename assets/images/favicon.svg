<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Escudo Oficial Karate Do">
  <defs>
    <!-- Ruta para el texto superior en arco -->
    <path id="arcTopText" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
    <!-- Ruta para el texto inferior en arco -->
    <path id="arcBottomText" d="M 166 108 A 70 70 0 0 1 34 108" fill="none" />
    
    <!-- Filtro de sombra sutil para efecto premium -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fondo circular limpio -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#0D1117" stroke-width="3" filter="url(#badgeShadow)" />
  <circle cx="100" cy="100" r="91" fill="none" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- Texto Arqueado Superior: KARATE DO -->
  <text font-family="'Syne', 'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-size="14.5" font-weight="900" fill="#0D1117" letter-spacing="3.5">
    <textPath href="#arcTopText" startOffset="50%" text-anchor="middle">
      KARATE DO
    </textPath>
  </text>

  <!-- Texto Arqueado Inferior: SHITO RYU (Sin 'La Joya' - Versión Minimalista Oficial) -->
  <text font-family="'Syne', 'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-size="11.5" font-weight="800" fill="#1B3B6F" letter-spacing="2.5">
    <textPath href="#arcBottomText" startOffset="50%" text-anchor="middle">
      SHITO RYU
    </textPath>
  </text>

  <!-- Puntos divisores decorativos a los lados -->
  <circle cx="28" cy="100" r="2.5" fill="#E63027" />
  <circle cx="172" cy="100" r="2.5" fill="#E63027" />

  <!-- EMBLEMA CENTRAL DE KARATE-DO / SHITO-RYU -->
  <g id="shito-ryu-emblem" transform="translate(100, 100)">
    <!-- Aro exterior rojo del emblema -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#E63027" stroke-width="9" />

    <!-- Barra horizontal roja que cruza -->
    <rect x="-49.5" y="-4.5" width="99" height="9" fill="#E63027" rx="1" />

    <!-- Arcos internos laterales característicos del mon Shito-Ryu -->
    <!-- Arco izquierdo -->
    <path d="M -15 -42 A 44 44 0 0 0 -15 42 L -15 -42 Z" fill="#E63027" />
    <!-- Ventanas blancas del arco izquierdo -->
    <path d="M -22 -35 A 35 35 0 0 0 -22 -11 L -22 -11 A 16 16 0 0 1 -22 -35 Z" fill="#FFFFFF" />
    <path d="M -22 11 A 35 35 0 0 0 -22 35 L -22 35 A 16 16 0 0 1 -22 11 Z" fill="#FFFFFF" />

    <!-- Arco derecho -->
    <path d="M 15 -42 A 44 44 0 0 1 15 42 L 15 -42 Z" fill="#E63027" />
    <!-- Ventanas blancas del arco derecho -->
    <path d="M 22 -35 A 35 35 0 0 1 22 -11 L 22 -11 A 16 16 0 0 0 22 -35 Z" fill="#FFFFFF" />
    <path d="M 22 11 A 35 35 0 0 1 22 35 L 22 35 A 16 16 0 0 0 22 11 Z" fill="#FFFFFF" />

    <!-- Columna central vertical blanca que alberga el Kanji -->
    <rect x="-14.5" y="-53.5" width="29" height="107" fill="#FFFFFF" />
    <!-- Bordes rojos verticales del pilar central -->
    <line x1="-14.5" y1="-53.5" x2="-14.5" y2="53.5" stroke="#E63027" stroke-width="3" />
    <line x1="14.5" y1="-53.5" x2="14.5" y2="53.5" stroke="#E63027" stroke-width="3" />

    <!-- Kanji vertical para KARATE-DO: 空 (Kara), 手 (Te), 道 (Do) -->
    <!-- 空 (Kara - Vacío / Cielo) -->
    <text x="0" y="-23" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Hiragino Sans', sans-serif" font-size="20" font-weight="900" fill="#0D1117">空</text>
    <!-- 手 (Te - Mano) -->
    <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Hiragino Sans', sans-serif" font-size="20" font-weight="900" fill="#0D1117">手</text>
    <!-- 道 (Do - Camino / Vía) -->
    <text x="0" y="31" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Hiragino Sans', sans-serif" font-size="20" font-weight="900" fill="#0D1117">道</text>
  </g>
</svg>
